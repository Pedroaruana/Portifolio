<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | Pedro Aruanã</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Preahvihear&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0f;
      color: #e8e8f0;
      font-family: 'Preahvihear', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .code {
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      color: #3ecf6e;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(3rem, 10vw, 6rem);
      color: #3ecf6e;
      line-height: 1;
      margin-bottom: 16px;
    }
    p {
      color: #7a7a90;
      font-size: 1rem;
      margin-bottom: 32px;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #3ecf6e;
      color: #0d0d0f;
      font-weight: 700;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 100px;
    }
    a.btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div>
    <div class="code">GET /essa-pagina &rarr; 404 Not Found</div>
    <h1>404</h1>
    <p>Essa página não existe — ou foi movida. Volta pro início e dá uma olhada nos projetos.</p>
    <a class="btn" href="/">&larr; Voltar pro início</a>
  </div>
</body>
</html>
